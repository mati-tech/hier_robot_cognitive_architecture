# Self-test: every task runs from the START positions of the cubes (Gazebo cubes do not really move).
# expect: where each cube must be after the task; refusal_ok: a D* refusal is the correct behaviour.
# Do NOT change these tasks or expectations to make a test pass: fix the code instead.
tests:
  - id: T1_direct
    task: "Отвези cube_0 из room_B в room_A"
    expect: {cube_0: room_A}
  - id: T2_room_by_furniture
    task: "Отвези все кубики из комнаты, где стоит стол со стульями, в комнату со стеллажами"
    expect: {cube_1: room_A, cube_3: room_A}
  - id: T3_nearest_to_chair
    task: "Отвези кубик, который лежит ближе всех к стулу, в room_E"
    expect: {cube_3: room_E, cube_1: room_D}
  - id: T4_forbidden_room
    task: "Отвези кубик из серверной комнаты в room_A"
    expect: {cube_2: room_C}
    refusal_ok: true
  - id: T5_to_object
    task: "Отвези cube_0 к мусорной корзине bin_hall"
    expect: {cube_0: hall}
